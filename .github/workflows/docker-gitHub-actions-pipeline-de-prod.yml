name: pipeline

on:
  pull_request:
    paths:
      - 'docker-gitHub-actions-pipeline-de-prod/**'
      - '.github/workflows/docker-gitHub-actions-pipeline-de-prod.yml'
  push:
    branches: [main]
    paths:
      - 'docker-gitHub-actions-pipeline-de-prod/**'
      - '.github/workflows/docker-gitHub-actions-pipeline-de-prod.yml'

# Um run por branch. PR novo cancela o anterior; na main NUNCA cancela um deploy no meio.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Menor privilégio por padrão: o token só LÊ. Quem precisa de mais, pede no próprio job.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  # ---------- 1) TESTE — roda em PR e em push na main ----------
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker-gitHub-actions-pipeline-de-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: pytest -q

  # ---------- 2) BUILD → SCAN → PUSH — só na main ----------
  # Ordem importa: buildamos localmente, escaneamos, e SÓ ENTÃO publicamos.
  # Imagem reprovada no Trivy morre aqui e NUNCA chega ao registry.
  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publicar no GHCR — e SÓ isso
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Tag imutável por commit (sha-abc1234). Sem :latest — :latest não é versão, é chute.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha

      # 1) BUILD local: carrega a imagem no daemon do runner (load), NÃO publica.
      #    Escreve o cache no GHA para o push reaproveitar sem rebuildar.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-gitHub-actions-pipeline-de-prod
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) SCAN: gate de segurança na imagem local (ainda não publicada).
      #    CRITICAL/HIGH com correção disponível = pipeline para aqui, antes do push.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Login só depois do gate passar. Nenhuma credencial de registry é usada antes.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3) PUSH: mesma imagem, agora publicada. Reaproveita o cache do buildx e do GHA
      #    (mesmo Dockerfile/contexto/build-arg): todas as camadas dão CACHED, só faz o push.
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-gitHub-actions-pipeline-de-prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

  # ---------- 3) DEPLOY — só depois do scan, e só com aprovação no environment ----------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/tbx-api
            echo "IMAGE_TAG=${IMAGE_TAG}" > .env
            docker compose pull --quiet
            docker compose up -d --remove-orphans
            docker image prune -f >/dev/null
            docker compose ps
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}

  bump-manifest:
    name: "GitOps · troca a tag no manifesto"
    needs: [build]                                # só depois que a imagem escaneada está no GHCR
    if: github.ref == 'refs/heads/main'           # o build já só roda na main; explícito por leitura
    runs-on: ubuntu-latest
    permissions:
      contents: write                             # o ÚNICO privilégio novo desta pipeline
    concurrency:
      group: gitops-bump                          # dois merges seguidos não disputam o push
      cancel-in-progress: false
    env:
      MANIFEST: k8s-hpa-probes-self-healing/k8s/deployment.yaml
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      # Use o MESMO SHA do actions/checkout que já está fixado neste workflow
      # (vídeo de 28/ago: action por tag = CVE-2026-33634). Não invente SHA.
      - uses: actions/checkout@COPIE-O-SHA-DO-CHECKOUT-JA-USADO-NESTE-WORKFLOW # v5
        with:
          ref: main
          fetch-depth: 0                          # `pull --rebase` precisa de histórico

      - name: Tag desta imagem
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Troca a tag (uma linha, e só ela)
        run: |
          set -euo pipefail
          # Exatamente 1 linha `image: ghcr.io/<repo>:sha-…` no manifesto — senão para aqui.
          n=$(grep -cE "image: ${IMAGE}:sha-[0-9a-fx]+" "${MANIFEST}" || true)
          if [ "${n}" != "1" ]; then
            echo "::error::esperava 1 linha 'image: ${IMAGE}:sha-…' em ${MANIFEST}, achei ${n}"; exit 1
          fi
          sed -i -E "s#(image: ${IMAGE}):sha-[0-9a-fx]+#\1:${TAG}#" "${MANIFEST}"
          echo "--- diff ---"; git --no-pager diff

      - name: Commit + push (o "deploy" é este commit)
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "manifesto já aponta para ${TAG}; nada a fazer"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(k8s): ${IMAGE}:${TAG}" \
            -m "Imagem publicada e escaneada pelo run ${{ github.run_id }}." \
            -m "Commit feito pela pipeline. Quem aplica no cluster é o Argo CD."
          # Alguém pode ter feito push na main durante o build: rebase e tenta de novo (3x).
          for i in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          echo "::error::não consegui fazer push após 3 tentativas"; exit 1
