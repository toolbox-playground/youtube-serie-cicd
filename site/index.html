<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Toolbox Tech — tecnologia, treinamentos e conteúdo especializado."
  >

  <title>Toolbox Tech</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at top, #1e3a5f 0%, #0f172a 45%, #020617 100%);
    }

    main {
      width: 100%;
      max-width: 760px;
      padding: 48px;
      text-align: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #0f172a;
      background: #38bdf8;
      border-radius: 18px;
    }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(2rem, 6vw, 3.4rem);
    }

    .subtitle {
      max-width: 580px;
      margin: 0 auto 36px;
      color: #cbd5e1;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 24px 16px;
      color: #f8fafc;
      text-decoration: none;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-4px);
      background: rgba(30, 58, 95, 0.9);
      border-color: #38bdf8;
      outline: none;
    }

    .card strong {
      font-size: 1.05rem;
      color: #38bdf8;
    }

    .card span {
      color: #cbd5e1;
      font-size: 0.88rem;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 36px;
      color: #64748b;
      font-size: 0.85rem;
    }

    @media (max-width: 680px) {
      main {
        padding: 36px 22px;
      }

      .links {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="logo" aria-hidden="true">TBX</div>

    <h1>Toolbox Tech</h1>

    <p class="subtitle">
      Tecnologia, arquitetura, DevOps, cloud e treinamentos para
      profissionais e empresas.
    </p>

    <section class="links" aria-label="Links da Toolbox Tech">
      <a
        class="card"
        href="https://www.tbxtech.com.br"
        target="_blank"
        rel="noopener noreferrer"
      >
        <strong>Website</strong>
        <span>www.tbxtech.com.br</span>
      </a>

      <a
        class="card"
        href="https://blog.tbxtech.com.br"
        target="_blank"
        rel="noopener noreferrer"
      >
        <strong>Blog</strong>
        <span>blog.tbxtech.com.br</span>
      </a>

      <a
        class="card"
        href="https://treinamentos.tbxtech.com.br"
        target="_blank"
        rel="noopener noreferrer"
      >
        <strong>Treinamentos</strong>
        <span>treinamentos.tbxtech.com.br</span>
      </a>
    </section>

    <footer>
      © <span id="current-year"></span> Toolbox Tech.
      Todos os direitos reservados.
    </footer>
  </main>

  <script>
    document.getElementById("current-year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
